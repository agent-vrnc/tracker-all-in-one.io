<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Картотека</title>
<style>
  :root{
    --paper:#EBEAE2;
    --card:#FBFAF6;
    --ink:#242321;
    --ink-soft:#5B5850;
    --brick:#B8433A;
    --mustard:#D9A62E;
    --sage:#6C7A5E;
    --line:#D7D4C6;
    --shadow: 0 1px 0 rgba(36,35,33,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(36,35,33,0.06) 1px, transparent 0);
    background-size: 14px 14px;
    color:var(--ink);
    font-family: 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    min-height:100vh;
  }
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}

  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 90px;}

  header{margin-bottom:18px;}
  header h1{
    font-size:26px;
    margin:0 0 2px;
    font-weight:600;
    letter-spacing:0.2px;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:13px;
  }

  .capture{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    box-shadow:var(--shadow);
    padding:10px;
    display:flex;
    gap:8px;
    margin-bottom:20px;
    position:relative;
  }
  .capture::before{
    content:"";
    position:absolute;
    left:-1px; top:8px; bottom:8px;
    width:3px;
    background:var(--brick);
    border-radius:2px;
  }
  .capture input{
    flex:1;
    border:none;
    background:transparent;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    outline:none;
    padding:6px 4px 6px 8px;
  }
  .capture input::placeholder{color:#A6A296;}
  .capture button{
    border:none;
    background:var(--ink);
    color:var(--card);
    padding:0 16px;
    border-radius:2px;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
  }
  .capture button:active{opacity:0.8;}

  .tabs{
    display:flex;
    gap:2px;
    margin-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .tab{
    flex:1;
    text-align:center;
    padding:9px 2px 10px;
    font-size:12.5px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:2px solid transparent;
    position:relative;
  }
  .tab .count{
    display:inline-block;
    min-width:15px;
    font-size:10.5px;
    margin-left:3px;
    color:var(--ink-soft);
  }
  .tab.active{
    color:var(--ink);
    border-bottom:2px solid var(--brick);
    font-weight:600;
  }

  .section-note{
    font-size:12.5px;
    color:var(--ink-soft);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    margin:0 0 12px;
    line-height:1.5;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    box-shadow:var(--shadow);
    padding:12px 12px 10px;
    margin-bottom:9px;
  }
  .card .txt{
    font-size:15.5px;
    line-height:1.4;
    margin:0 0 8px;
    word-break:break-word;
  }
  .card .txt.done{
    text-decoration:line-through;
    color:var(--ink-soft);
  }
  .row-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  .chip{
    font-size:11.5px;
    padding:5px 9px;
    border-radius:20px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .chip:active{background:var(--paper);}
  .chip.danger{color:var(--brick);border-color:rgba(184,67,58,0.3);}
  .chip.go{color:var(--sage);border-color:rgba(108,122,94,0.3);}

  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .empty .big{font-size:28px;display:block;margin-bottom:8px;}

  .proj-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .proj-head .name{font-size:16.5px;font-weight:600;}
  .badge-active{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:10px;
    background:var(--sage);
    color:var(--card);
    padding:3px 7px;
    border-radius:20px;
  }
  .badge-parked{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:10px;
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--line);
    padding:2.5px 7px;
    border-radius:20px;
  }
  .steps{margin:6px 0 8px;padding:0;list-style:none;}
  .steps li{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    padding:5px 0;
    border-bottom:1px dashed var(--line);
  }
  .steps li:last-child{border-bottom:none;}
  .steps li .dot{
    width:15px;height:15px;
    border-radius:50%;
    border:1.5px solid var(--ink-soft);
    flex-shrink:0;
    cursor:pointer;
  }
  .steps li .dot.on{
    background:var(--sage);
    border-color:var(--sage);
  }
  .steps li .stxt.on{text-decoration:line-through;color:var(--ink-soft);}
  .add-step{
    display:flex;
    gap:6px;
    margin-top:4px;
  }
  .add-step input{
    flex:1;
    border:1px solid var(--line);
    border-radius:2px;
    padding:6px 8px;
    font-size:13px;
    font-family:inherit;
    background:var(--paper);
  }
  .add-step button{
    border:none;background:var(--line);color:var(--ink);
    padding:0 10px;border-radius:2px;font-size:12px;cursor:pointer;
  }

  .limit-warn{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:12px;
    background:rgba(217,166,46,0.15);
    border:1px solid rgba(217,166,46,0.4);
    color:#8A6A16;
    padding:8px 10px;
    border-radius:3px;
    margin-bottom:10px;
  }

  .timer-box{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    box-shadow:var(--shadow);
    padding:16px;
    text-align:center;
    margin-bottom:14px;
  }
  .timer-num{
    font-size:38px;
    font-weight:600;
    letter-spacing:1px;
    margin:4px 0 10px;
  }
  .timer-controls{
    display:flex;
    gap:8px;
    justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  .timer-controls button{
    border:1px solid var(--line);
    background:transparent;
    padding:7px 14px;
    border-radius:20px;
    font-size:12.5px;
    cursor:pointer;
    color:var(--ink);
  }
  .timer-controls button.primary{
    background:var(--ink);
    color:var(--card);
    border-color:var(--ink);
  }

  .loading{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Открываю картотеку…</div>
</div>

<script>
const STORE_KEY = 'tracker:data:v1';

let state = {
  inbox: [],   // {id, text, ts}
  projects: [], // {id, name, active, steps:[{id,text,done}]}
  tasks: [],   // {id, text, done}
  someday: [], // {id, text}
};
let activeTab = 'inbox';
let timerSeconds = 20*60;
let timerRunning = false;
let timerInterval = null;
let ready = false;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

async function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  }catch(e){
    // no data yet, or storage unavailable — fine, start fresh
  }
  ready = true;
  render();
}

async function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('save failed', e);
  }
}

function switchTab(t){ activeTab = t; render(); }

function addInbox(text){
  if(!text.trim()) return;
  state.inbox.unshift({id:uid(), text:text.trim(), ts:Date.now()});
  save(); render();
}

function moveToProject(item){
  state.projects.unshift({id:uid(), name:item.text, active:false, steps:[]});
  state.inbox = state.inbox.filter(i=>i.id!==item.id);
  save(); switchTab('projects');
}
function moveToTask(item){
  state.tasks.unshift({id:uid(), text:item.text, done:false});
  state.inbox = state.inbox.filter(i=>i.id!==item.id);
  save(); switchTab('tasks');
}
function moveToSomeday(item){
  state.someday.unshift({id:uid(), text:item.text});
  state.inbox = state.inbox.filter(i=>i.id!==item.id);
  save(); render();
}
function deleteInbox(id){
  state.inbox = state.inbox.filter(i=>i.id!==id);
  save(); render();
}

function activeProjectCount(){
  return state.projects.filter(p=>p.active).length;
}
function toggleProjectActive(id){
  const p = state.projects.find(p=>p.id===id);
  if(!p) return;
  if(!p.active && activeProjectCount()>=2){
    return; // enforced in UI via disabled state, but double-guard
  }
  p.active = !p.active;
  save(); render();
}
function deleteProject(id){
  state.projects = state.projects.filter(p=>p.id!==id);
  save(); render();
}
function addStep(projId, text){
  if(!text.trim()) return;
  const p = state.projects.find(p=>p.id===projId);
  p.steps.push({id:uid(), text:text.trim(), done:false});
  save(); render();
}
function toggleStep(projId, stepId){
  const p = state.projects.find(p=>p.id===projId);
  const s = p.steps.find(s=>s.id===stepId);
  s.done = !s.done;
  save(); render();
}

function toggleTask(id){
  const t = state.tasks.find(t=>t.id===id);
  t.done = !t.done;
  save(); render();
}
function deleteTask(id){
  state.tasks = state.tasks.filter(t=>t.id!==id);
  save(); render();
}

function somedayToProject(id){
  const item = state.someday.find(i=>i.id===id);
  state.projects.unshift({id:uid(), name:item.text, active:false, steps:[]});
  state.someday = state.someday.filter(i=>i.id!==id);
  save(); switchTab('projects');
}
function somedayToTask(id){
  const item = state.someday.find(i=>i.id===id);
  state.tasks.unshift({id:uid(), text:item.text, done:false});
  state.someday = state.someday.filter(i=>i.id!==id);
  save(); switchTab('tasks');
}
function deleteSomeday(id){
  state.someday = state.someday.filter(i=>i.id!==id);
  save(); render();
}

function fmtTime(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return m+':'+sec;
}
function timerStart(){
  if(timerRunning) return;
  timerRunning = true;
  timerInterval = setInterval(()=>{
    timerSeconds--;
    if(timerSeconds<=0){
      clearInterval(timerInterval);
      timerRunning=false;
      timerSeconds=0;
    }
    updateTimerDisplay();
  },1000);
  render();
}
function timerPause(){
  timerRunning=false;
  clearInterval(timerInterval);
  render();
}
function timerReset(mins){
  clearInterval(timerInterval);
  timerRunning=false;
  timerSeconds = mins*60;
  render();
}
function updateTimerDisplay(){
  const el = document.getElementById('timerNum');
  if(el) el.textContent = fmtTime(timerSeconds);
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render(){
  const app = document.getElementById('app');
  if(!ready){ app.innerHTML = '<div class="loading">Открываю картотеку…</div>'; return; }

  const counts = {
    inbox: state.inbox.length,
    projects: state.projects.length,
    tasks: state.tasks.filter(t=>!t.done).length,
    learn: activeProjectCount(),
    someday: state.someday.length
  };

  let html = `
    <header>
      <h1>Картотека</h1>
      <p>Сначала запиши — потом разберёшь</p>
    </header>

    <div class="capture">
      <input id="captureInput" type="text" placeholder="Что пришло в голову?" />
      <button class="sans" onclick="handleCapture()">Внести</button>
    </div>

    <div class="tabs sans">
      ${tabBtn('inbox','Инбокс',counts.inbox)}
      ${tabBtn('projects','Проекты',counts.projects)}
      ${tabBtn('tasks','Задачи',counts.tasks)}
      ${tabBtn('learn','Фокус',null)}
      ${tabBtn('someday','Потом',counts.someday)}
    </div>
  `;

  if(activeTab==='inbox') html += renderInbox();
  if(activeTab==='projects') html += renderProjects();
  if(activeTab==='tasks') html += renderTasks();
  if(activeTab==='learn') html += renderLearn();
  if(activeTab==='someday') html += renderSomeday();

  app.innerHTML = html;

  const inp = document.getElementById('captureInput');
  if(inp){
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') handleCapture(); });
  }
  document.querySelectorAll('.add-step-input').forEach(inp=>{
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter'){
        addStep(inp.dataset.proj, inp.value);
        inp.value='';
      }
    });
  });
}

function tabBtn(id,label,count){
  const cls = activeTab===id ? 'tab active' : 'tab';
  const c = (count===null) ? '' : `<span class="count">${count}</span>`;
  return `<div class="${cls}" onclick="switchTab('${id}')">${label}${c}</div>`;
}

function handleCapture(){
  const inp = document.getElementById('captureInput');
  addInbox(inp.value);
  inp.value='';
  inp.focus();
}

function renderInbox(){
  if(state.inbox.length===0){
    return `<div class="empty"><span class="big">✎</span>Инбокс пуст — всё разобрано.<br>Впиши новую мысль наверху.</div>`;
  }
  let html = `<p class="section-note">Разложи каждую запись: это проект (несколько шагов), задача (одно действие) или пока «потом».</p>`;
  state.inbox.forEach(item=>{
    html += `
      <div class="card">
        <p class="txt">${escapeHtml(item.text)}</p>
        <div class="row-actions">
          <button class="chip go" onclick="moveToProject(${JSON.stringify(item).replace(/"/g,'&quot;')})">→ проект</button>
          <button class="chip go" onclick="moveToTask(${JSON.stringify(item).replace(/"/g,'&quot;')})">→ задача</button>
          <button class="chip" onclick="moveToSomeday(${JSON.stringify(item).replace(/"/g,'&quot;')})">→ потом</button>
          <button class="chip danger" onclick="deleteInbox('${item.id}')">удалить</button>
        </div>
      </div>`;
  });
  return html;
}

function renderProjects(){
  if(state.projects.length===0){
    return `<div class="empty"><span class="big">◧</span>Проектов пока нет.<br>Разбери что-нибудь из инбокса.</div>`;
  }
  let html = `<p class="section-note">Держи в фокусе максимум 2 активных проекта — остальные подождут.</p>`;
  state.projects.forEach(p=>{
    const doneCount = p.steps.filter(s=>s.done).length;
    const canActivate = p.active || activeProjectCount()<2;
    html += `
      <div class="card">
        <div class="proj-head">
          <span class="name">${escapeHtml(p.name)}</span>
          ${p.active ? '<span class="badge-active">в фокусе</span>' : '<span class="badge-parked">в очереди</span>'}
        </div>
        ${p.steps.length ? `<ul class="steps">` + p.steps.map(s=>`
          <li>
            <span class="dot ${s.done?'on':''}" onclick="toggleStep('${p.id}','${s.id}')"></span>
            <span class="stxt ${s.done?'on':''}">${escapeHtml(s.text)}</span>
          </li>`).join('') + `</ul>` : ''}
        <div class="add-step">
          <input class="add-step-input sans" data-proj="${p.id}" type="text" placeholder="Добавить шаг…" />
        </div>
        <div class="row-actions" style="margin-top:8px;">
          <button class="chip ${p.active?'':'go'}" ${!canActivate?'disabled style="opacity:0.4"':''} onclick="toggleProjectActive('${p.id}')">
            ${p.active ? 'снять фокус' : 'в фокус'}
          </button>
          <button class="chip danger" onclick="deleteProject('${p.id}')">удалить</button>
        </div>
      </div>`;
  });
  return html;
}

function renderTasks(){
  const open = state.tasks.filter(t=>!t.done);
  const done = state.tasks.filter(t=>t.done);
  if(state.tasks.length===0){
    return `<div class="empty"><span class="big">✓</span>Задач нет.<br>Разбери что-нибудь из инбокса.</div>`;
  }
  let html = '';
  open.forEach(t=>{
    html += `
      <div class="card">
        <p class="txt">${escapeHtml(t.text)}</p>
        <div class="row-actions">
          <button class="chip go" onclick="toggleTask('${t.id}')">сделано</button>
          <button class="chip danger" onclick="deleteTask('${t.id}')">удалить</button>
        </div>
      </div>`;
  });
  if(done.length){
    html += `<p class="section-note" style="margin-top:14px;">Сделано</p>`;
    done.forEach(t=>{
      html += `
        <div class="card">
          <p class="txt done">${escapeHtml(t.text)}</p>
          <div class="row-actions">
            <button class="chip" onclick="toggleTask('${t.id}')">вернуть</button>
            <button class="chip danger" onclick="deleteTask('${t.id}')">удалить</button>
          </div>
        </div>`;
    });
  }
  return html;
}

function renderLearn(){
  const active = state.projects.filter(p=>p.active);
  let html = `
    <p class="section-note">20 минут на один активный проект — без настроя, просто таймер.</p>
    <div class="timer-box">
      <div class="timer-num" id="timerNum">${fmtTime(timerSeconds)}</div>
      <div class="timer-controls">
        <button class="primary" onclick="${timerRunning?'timerPause()':'timerStart()'}">${timerRunning?'пауза':'старт'}</button>
        <button onclick="timerReset(20)">20 мин</button>
        <button onclick="timerReset(5)">5 мин</button>
      </div>
    </div>
  `;
  if(active.length===0){
    html += `<div class="empty"><span class="big">◎</span>Нет проектов в фокусе.<br>Отметь 1-2 проекта активными во вкладке «Проекты».</div>`;
  }else{
    active.forEach(p=>{
      const next = p.steps.find(s=>!s.done);
      html += `
        <div class="card">
          <div class="proj-head"><span class="name">${escapeHtml(p.name)}</span><span class="badge-active">в фокусе</span></div>
          ${next ? `<p class="txt">Следующий шаг: ${escapeHtml(next.text)}</p>` : `<p class="txt" style="color:var(--ink-soft)">Шаги не заданы — добавь во вкладке «Проекты».</p>`}
        </div>`;
    });
  }
  return html;
}

function renderSomeday(){
  if(state.someday.length===0){
    return `<div class="empty"><span class="big">◫</span>Список «потом» пуст.</div>`;
  }
  let html = `<p class="section-note">Идеи, до которых пока не дошли руки — не пропали, просто ждут.</p>`;
  state.someday.forEach(item=>{
    html += `
      <div class="card">
        <p class="txt">${escapeHtml(item.text)}</p>
        <div class="row-actions">
          <button class="chip go" onclick="somedayToProject('${item.id}')">→ проект</button>
          <button class="chip go" onclick="somedayToTask('${item.id}')">→ задача</button>
          <button class="chip danger" onclick="deleteSomeday('${item.id}')">удалить</button>
        </div>
      </div>`;
  });
  return html;
}

load();
</script>
</body>
</html>
