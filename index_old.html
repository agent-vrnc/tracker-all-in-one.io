<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Картотека</title>
<style>
  :root{
    --paper:#EBEAE2;
    --card:#FBFAF6;
    --ink:#242321;
    --ink-soft:#5B5850;
    --brick:#B8433A;
    --mustard:#D9A62E;
    --sage:#6C7A5E;
    --line:#D7D4C6;
    --shadow: 0 1px 0 rgba(36,35,33,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(36,35,33,0.06) 1px, transparent 0);
    background-size: 14px 14px;
    color:var(--ink);
    font-family: 'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
    min-height:100vh;
  }
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}

  .wrap{max-width:520px;margin:0 auto;padding:20px 16px 90px;}

  header{margin-bottom:18px;}
  header h1{
    font-size:26px;
    margin:0 0 2px;
    font-weight:600;
    letter-spacing:0.2px;
  }
  header p{
    margin:0;
    color:var(--ink-soft);
    font-size:13px;
  }

  .capture{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    box-shadow:var(--shadow);
    padding:10px;
    display:flex;
    gap:8px;
    margin-bottom:20px;
    position:relative;
  }
  .capture::before{
    content:"";
    position:absolute;
    left:-1px; top:8px; bottom:8px;
    width:3px;
    background:var(--brick);
    border-radius:2px;
  }
  .capture input{
    flex:1;
    border:none;
    background:transparent;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
    outline:none;
    padding:6px 4px 6px 8px;
  }
  .capture input::placeholder{color:#A6A296;}
  .capture button{
    border:none;
    background:var(--ink);
    color:var(--card);
    padding:0 16px;
    border-radius:2px;
    font-size:13px;
    font-family:inherit;
    cursor:pointer;
  }
  .capture button:active{opacity:0.8;}

  .tabs{
    display:flex;
    gap:2px;
    margin-bottom:14px;
    border-bottom:1px solid var(--line);
  }
  .tab{
    flex:1;
    text-align:center;
    padding:9px 2px 10px;
    font-size:12.5px;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    color:var(--ink-soft);
    cursor:pointer;
    border-bottom:2px solid transparent;
    position:relative;
  }
  .tab .count{
    display:inline-block;
    min-width:15px;
    font-size:10.5px;
    margin-left:3px;
    color:var(--ink-soft);
  }
  .tab.active{
    color:var(--ink);
    border-bottom:2px solid var(--brick);
    font-weight:600;
  }

  .section-note{
    font-size:12.5px;
    color:var(--ink-soft);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    margin:0 0 12px;
    line-height:1.5;
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    box-shadow:var(--shadow);
    padding:12px 12px 10px;
    margin-bottom:9px;
  }
  .card .txt{
    font-size:15.5px;
    line-height:1.4;
    margin:0 0 8px;
    word-break:break-word;
  }
  .card .txt.done{
    text-decoration:line-through;
    color:var(--ink-soft);
  }
  .row-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  .chip{
    font-size:11.5px;
    padding:5px 9px;
    border-radius:20px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .chip:active{background:var(--paper);}
  .chip.danger{color:var(--brick);border-color:rgba(184,67,58,0.3);}
  .chip.go{color:var(--sage);border-color:rgba(108,122,94,0.3);}

  .empty{
    text-align:center;
    padding:40px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }
  .empty .big{font-size:28px;display:block;margin-bottom:8px;}

  .proj-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:6px;
  }
  .proj-head .name{font-size:16.5px;font-weight:600;}
  .badge-active{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:10px;
    background:var(--sage);
    color:var(--card);
    padding:3px 7px;
    border-radius:20px;
  }
  .badge-parked{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:10px;
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--line);
    padding:2.5px 7px;
    border-radius:20px;
  }
  .steps{margin:6px 0 8px;padding:0;list-style:none;}
  .steps li{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14px;
    padding:5px 0;
    border-bottom:1px dashed var(--line);
  }
  .steps li:last-child{border-bottom:none;}
  .steps li .dot{
    width:15px;height:15px;
    border-radius:50%;

    border-color:var(--sage);

  .steps li .stxt.on{text-decoration:line-through;color:var(--ink-soft);}
  .add-step{
    display:flex;
    gap:6px;

  }
  .add-step input{
    flex:1;
    border:1px solid var(--line);
    border-radius:2px;
    padding:6px 8px;

    font-family:inherit;

  }
  .add-step button{
    border:none;background:var(--line);color:var(--ink);
    padding:0 10px;border-radius:2px;font-size:12px;cursor:pointer;

  .toolbar{
    display:flex;
    gap:8px;
    justify-content:flex-end;
    margin-bottom:12px;
  }
  .toolbar button{
    font-size:11px;
    border:1px solid var(--line);

    color:var(--ink-soft);

  }
  .toolbar button:active{background:var(--card);}

  .week-dots{
    display:flex;
    gap:5px;
    margin:6px 0 4px;
  }
  .wdot{
    width:11px;height:11px;
    border-radius:3px;
    background:var(--line);
    display:inline-block;
  }
  .wdot.on{background:var(--sage);}

  .cal-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:15px;
    font-weight:600;
  }
  .cal-nav button{
    border:none;
    background:transparent;
    font-size:22px;
    line-height:1;
    color:var(--ink);
    cursor:pointer;
    padding:0 10px;
  }
  .cal-weekdays{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    text-align:center;
    font-size:10.5px;
    color:var(--ink-soft);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    margin-bottom:4px;
  }
  .cal-grid{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:4px;
    margin-bottom:18px;
  }
  .cal-cell{
    aspect-ratio:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    border-radius:5px;
    font-size:13px;
    cursor:pointer;
    background:var(--card);
    border:1px solid var(--line);
  }
  .cal-cell.empty{
    visibility:hidden;
    cursor:default;
  }
  .cal-cell.today{
    border-color:var(--brick);
    border-width:1.5px;
    font-weight:700;
  }
  .cal-cell.selected{
    background:var(--ink);
    color:var(--card);
    border-color:var(--ink);
  }
  .cal-dots{
    display:flex;
    gap:2px;
    margin-top:2px;
    height:5px;
  }
  .cal-dots span{
    width:4px;height:4px;
    border-radius:50%;
    display:inline-block;
  }
  .day-detail-head{
    font-size:17px;
    font-weight:600;
    margin:2px 0 10px;
  }
  .day-section-title{
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:0.5px;
    margin:16px 0 6px;

  .event-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:14.5px;
    padding:7px 0;
    border-bottom:1px dashed var(--line);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  .event-row:last-child{border-bottom:none;}
  .event-time{
    font-size:11.5px;
    color:var(--ink-soft);
    min-width:38px;
  }
  .add-event{
    display:flex;
    gap:6px;
    margin-top:10px;
  }
  .add-event input[type="text"]{
    flex:1;
    border:1px solid var(--line);
    border-radius:2px;
    padding:7px 8px;
    font-size:13px;
    background:var(--card);
  }
  .add-event input[type="time"]{
    width:88px;
    border:1px solid var(--line);
    border-radius:2px;
    padding:6px 6px;
    font-size:12.5px;
    background:var(--card);
  }

  .jr-tabs{
    display:flex;
    gap:16px;
    margin-bottom:9px;
    font-size:12.5px;
  }
  .jr-tab{
    cursor:pointer;
    color:var(--ink-soft);
    padding-bottom:4px;
    border-bottom:2px solid transparent;
  }
  .jr-tab.active{
    color:var(--ink);
    font-weight:600;
    border-bottom-color:var(--brick);
  }
  .journal-textarea{
    width:100%;
    min-height:170px;
    border:1px solid var(--line);
    border-radius:3px;
    background:var(--paper);
    padding:11px;
    font-family:'SFMono-Regular',Consolas,Menlo,monospace;
    font-size:13.5px;
    line-height:1.55;
    resize:vertical;
    color:var(--ink);
  }
  .journal-preview{
    font-size:14.5px;
    line-height:1.55;
    min-height:40px;
  }
  .journal-preview h1, .journal-preview h2, .journal-preview h3,
  .journal-preview h4, .journal-preview h5, .journal-preview h6{
    margin:10px 0 6px;
    font-family:inherit;
    line-height:1.3;
  }
  .journal-preview h1{font-size:21px;}
  .journal-preview h2{font-size:18px;}
  .journal-preview h3{font-size:16px;}
  .journal-preview pre{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:3px;
    padding:9px;
    overflow-x:auto;
    font-size:12.5px;
    font-family:'SFMono-Regular',Consolas,Menlo,monospace;
  }
  .journal-preview code{
    background:var(--paper);
    padding:1px 4px;
    border-radius:2px;
    font-size:0.9em;
    font-family:'SFMono-Regular',Consolas,Menlo,monospace;
  }
  .journal-preview blockquote{
    border-left:3px solid var(--line);
    margin:6px 0;
    padding-left:10px;
    color:var(--ink-soft);
  }
  .journal-preview ul{
    margin:6px 0;
    padding-left:20px;
  }
  .journal-preview a{color:var(--brick);}
  .jr-select{
    border:1px solid var(--line);
    border-radius:20px;
    background:transparent;
    padding:5px 10px;
    font-size:11.5px;
    color:var(--ink-soft);
    font-family:inherit;
  }

  .limit-warn{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    font-size:12px;
    background:rgba(217,166,46,0.15);
    border:1px solid rgba(217,166,46,0.4);
    color:#8A6A16;
    padding:8px 10px;
    border-radius:3px;
    margin-bottom:10px;
  }

  .timer-box{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    box-shadow:var(--shadow);
    padding:16px;
    text-align:center;
    margin-bottom:14px;
  }
  .timer-num{
    font-size:38px;
    font-weight:600;
    letter-spacing:1px;
    margin:4px 0 10px;
  }
  .timer-controls{
    display:flex;
    gap:8px;
    justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  .timer-controls button{
    border:1px solid var(--line);
    background:transparent;
    padding:7px 14px;
    border-radius:20px;
    font-size:12.5px;
    cursor:pointer;
    color:var(--ink);
  }
  .timer-controls button.primary{
    background:var(--ink);
    color:var(--card);
    border-color:var(--ink);
  }

  .loading{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    font-size:14px;
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Открываю картотеку…</div>
</div>

<script>
const STORE_KEY = 'tracker:data:v1';

let state = {
  inbox: [],   // {id, text, ts}
  projects: [], // {id, name, active, steps:[{id,text,done}]}
  tasks: [],   // {id, text, done, date, doneDate}
  someday: [], // {id, text}
  habits: [],  // {id, name, doneDates:[ 'YYYY-MM-DD', ... ]}
  events: [],  // {id, title, date:'YYYY-MM-DD', time:'HH:MM'|null}
  journal: [], // {id, text, projectId:null|id, createdAt, updatedAt}
  pomodoroCount: 0,
};
let activeTab = 'inbox';

let journalMode = 'write'; // 'write' | 'preview'
let journalDraft = { text: '', projectId: '', editingId: null };

const POMO_WORK = 25, POMO_SHORT = 5, POMO_LONG = 15;
let timerMode = 'work'; // 'work' | 'short' | 'long'
let timerSeconds = POMO_WORK*60;
let timerRunning = false;
let timerInterval = null;
let ready = false;

const _todayD = new Date();
let calendarYear = _todayD.getFullYear();
let calendarMonth = _todayD.getMonth(); // 0-indexed
let selectedDate = null; // set to todayStr() after load

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

async function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      state = Object.assign(state, parsed);
    }
  }catch(e){
    // no data yet, or storage unavailable — fine, start fresh
  }
  ready = true;
  selectedDate = todayStr();
  render();
}

async function save(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }catch(e){
    console.error('save failed', e);
  }
}

function switchTab(t){ activeTab = t; render(); }

function addInbox(text){
  if(!text.trim()) return;
  state.inbox.unshift({id:uid(), text:text.trim(), ts:Date.now()});
  save(); render();
}

function moveToProject(item){
  state.projects.unshift({id:uid(), name:item.text, active:false, steps:[]});
  state.inbox = state.inbox.filter(i=>i.id!==item.id);
  save(); switchTab('projects');
}
function moveToTask(item){
  state.tasks.unshift({id:uid(), text:item.text, done:false, date:null, doneDate:null});
  state.inbox = state.inbox.filter(i=>i.id!==item.id);
  save(); switchTab('tasks');
}
function moveToSomeday(item){
  state.someday.unshift({id:uid(), text:item.text});
  state.inbox = state.inbox.filter(i=>i.id!==item.id);
  save(); render();
}
function deleteInbox(id){
  state.inbox = state.inbox.filter(i=>i.id!==id);
  save(); render();
}

function activeProjectCount(){
  return state.projects.filter(p=>p.active).length;
}
function toggleProjectActive(id){
  const p = state.projects.find(p=>p.id===id);
  if(!p) return;
  if(!p.active && activeProjectCount()>=2){
    return; // enforced in UI via disabled state, but double-guard
  }
  p.active = !p.active;
  save(); render();
}
function deleteProject(id){
  state.projects = state.projects.filter(p=>p.id!==id);
  save(); render();
}
function addStep(projId, text){
  if(!text.trim()) return;
  const p = state.projects.find(p=>p.id===projId);
  p.steps.push({id:uid(), text:text.trim(), done:false});
  save(); render();
}
function toggleStep(projId, stepId){
  const p = state.projects.find(p=>p.id===projId);
  const s = p.steps.find(s=>s.id===stepId);
  s.done = !s.done;
  save(); render();
}

function toggleTask(id){
  const t = state.tasks.find(t=>t.id===id);
  t.done = !t.done;
  t.doneDate = t.done ? todayStr() : null;
  save(); render();
}
function scheduleTask(id, ds){
  const t = state.tasks.find(t=>t.id===id);
  t.date = ds || null;
  save(); render();
}
function deleteTask(id){
  state.tasks = state.tasks.filter(t=>t.id!==id);
  save(); render();
}

function somedayToProject(id){
  const item = state.someday.find(i=>i.id===id);
  state.projects.unshift({id:uid(), name:item.text, active:false, steps:[]});
  state.someday = state.someday.filter(i=>i.id!==id);
  save(); switchTab('projects');
}
function somedayToTask(id){
  const item = state.someday.find(i=>i.id===id);
  state.tasks.unshift({id:uid(), text:item.text, done:false, date:null, doneDate:null});
  state.someday = state.someday.filter(i=>i.id!==id);
  save(); switchTab('tasks');
}
function deleteSomeday(id){
  state.someday = state.someday.filter(i=>i.id!==id);
  save(); render();
}

function todayStr(){
  const d = new Date();
  const y = d.getFullYear(), m=(d.getMonth()+1).toString().padStart(2,'0'), day=d.getDate().toString().padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function dateStrOffset(offsetDays){
  const d = new Date();
  d.setDate(d.getDate()+offsetDays);
  const y = d.getFullYear(), m=(d.getMonth()+1).toString().padStart(2,'0'), day=d.getDate().toString().padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function addHabit(text){
  if(!text.trim()) return;
  state.habits.unshift({id:uid(), name:text.trim(), doneDates:[]});
  save(); render();
}
function toggleHabitDate(id, ds){
  const h = state.habits.find(h=>h.id===id);
  if(h.doneDates.includes(ds)) h.doneDates = h.doneDates.filter(d=>d!==ds);
  else h.doneDates.push(ds);
  save(); render();
}
function toggleHabitToday(id){
  toggleHabitDate(id, todayStr());
}
function deleteHabit(id){
  state.habits = state.habits.filter(h=>h.id!==id);
  save(); render();
}
function habitStreak(h){
  let count=0;
  let offset=0;
  const t = todayStr();
  if(!h.doneDates.includes(t)) return 0;
  while(h.doneDates.includes(dateStrOffset(offset))){ count++; offset--; }
  return count;
}

const MONTHS_RU = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_RU_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WEEKDAYS_SHORT = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const WEEKDAYS_FULL = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];

function dateStrFromParts(y,m,d){
  return `${y}-${(m+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
}
function prevMonth(){
  calendarMonth--; if(calendarMonth<0){calendarMonth=11; calendarYear--;}
  render();
}
function nextMonth(){
  calendarMonth++; if(calendarMonth>11){calendarMonth=0; calendarYear++;}
  render();
}
function goToday(){
  const t = new Date();
  calendarYear = t.getFullYear(); calendarMonth = t.getMonth();
  selectedDate = todayStr();
  render();
}
function selectDay(ds){
  selectedDate = ds;
  render();
}
function daySummary(ds){
  return {
    habitsDone: state.habits.filter(h=>h.doneDates.includes(ds)).length,
    tasks: state.tasks.filter(t=>t.date===ds || t.doneDate===ds).length,
    events: state.events.filter(e=>e.date===ds).length,
  };
}
function addEventForSelected(){
  const titleInp = document.getElementById('eventTitleInput');
  const timeInp = document.getElementById('eventTimeInput');
  if(!titleInp.value.trim()) return;
  state.events.push({id:uid(), title:titleInp.value.trim(), date:selectedDate, time:timeInp.value||null});
  titleInp.value=''; timeInp.value='';
  save(); render();
}
function deleteEvent(id){
  state.events = state.events.filter(e=>e.id!==id);
  save(); render();
}

function markdownToHtml(md){
  let s = escapeHtml(md);
  s = s.replace(/```([\s\S]*?)```/g, (m,code)=>`<pre><code>${code}</code></pre>`);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/^###### (.*)$/gm,'<h6>$1</h6>')
       .replace(/^##### (.*)$/gm,'<h5>$1</h5>')
       .replace(/^#### (.*)$/gm,'<h4>$1</h4>')
       .replace(/^### (.*)$/gm,'<h3>$1</h3>')
       .replace(/^## (.*)$/gm,'<h2>$1</h2>')
       .replace(/^# (.*)$/gm,'<h1>$1</h1>');
  s = s.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g,'<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>');

  const lines = s.split('\n');
  let out = [];
  let inList = false;
  for(let line of lines){
    const isChecklist = /^[-*] \[[ xX]\] /.test(line);
    const isBullet = /^[-*] /.test(line);
    if(isChecklist || isBullet){
      if(!inList){ out.push('<ul>'); inList=true; }
      if(isChecklist){
        const checked = /\[[xX]\]/.test(line);
        const content = line.replace(/^[-*] \[[ xX]\] /,'');
        out.push(`<li><input type="checkbox" disabled ${checked?'checked':''}/> ${content}</li>`);
      }else{
        out.push(`<li>${line.replace(/^[-*] /,'')}</li>`);
      }
    }else{
      if(inList){ out.push('</ul>'); inList=false; }
      out.push(line);
    }
  }
  if(inList) out.push('</ul>');
  s = out.join('\n');
  s = s.replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>');
  s = s.replace(/<br>\s*(<\/?(h1|h2|h3|h4|h5|h6|ul|li|pre|blockquote)[^>]*>)/g, '$1');
  s = s.replace(/(<\/?(h1|h2|h3|h4|h5|h6|ul|li|pre|blockquote)[^>]*>)\s*<br>/g, '$1');
  return s;
}

function journalSetMode(mode){ journalMode = mode; render(); }
function journalStartNew(){
  journalDraft = {text:'', projectId:'', editingId:null};
  journalMode='write';
  render();
}
function journalEditEntry(id){
  const e = state.journal.find(e=>e.id===id);
  if(!e) return;
  journalDraft = {text:e.text, projectId:e.projectId||'', editingId:id};
  journalMode='write';
  render();
}
function journalCancelEdit(){
  journalDraft = {text:'', projectId:'', editingId:null};
  render();
}
function journalSave(){
  const text = journalDraft.text.trim();
  if(!text) return;
  const pid = journalDraft.projectId || null;
  if(journalDraft.editingId){
    const e = state.journal.find(e=>e.id===journalDraft.editingId);
    e.text = text; e.projectId = pid; e.updatedAt = Date.now();
  }else{
    state.journal.unshift({id:uid(), text, projectId:pid, createdAt:Date.now(), updatedAt:Date.now()});
  }
  journalDraft = {text:'', projectId:'', editingId:null};
  save(); render();
}
function deleteJournalEntry(id){
  state.journal = state.journal.filter(e=>e.id!==id);
  save(); render();
}

function fmtTime(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return m+':'+sec;
}
function modeMinutes(mode){
  return mode==='work' ? POMO_WORK : mode==='short' ? POMO_SHORT : POMO_LONG;
}
function modeLabel(mode){
  return mode==='work' ? 'Работа' : mode==='short' ? 'Короткий перерыв' : 'Длинный перерыв';
}

function toggleTimer(){
  if(timerRunning) timerPause(); else timerStart();
}
function timerStart(){
  if(timerRunning) return;
  if(timerSeconds<=0) timerSeconds = modeMinutes(timerMode)*60;
  timerRunning = true;
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    timerSeconds--;
    if(timerSeconds<=0){
      clearInterval(timerInterval);
      timerRunning=false;
      timerSeconds=0;
      handleTimerComplete();
      return;
    }
    updateTimerDisplay();
  },1000);
  render();
}
function timerPause(){
  timerRunning=false;
  clearInterval(timerInterval);
  render();
}
function handleTimerComplete(){
  if(timerMode==='work'){
    state.pomodoroCount++;
    save();
    timerMode = (state.pomodoroCount % 4 === 0) ? 'long' : 'short';
  }else{
    timerMode = 'work';
  }
  timerSeconds = modeMinutes(timerMode)*60;
  render();
}
function timerModeSet(mode){
  clearInterval(timerInterval);
  timerRunning=false;
  timerMode = mode;
  timerSeconds = modeMinutes(mode)*60;
  render();
}
function updateTimerDisplay(){
  const el = document.getElementById('timerNum');
  if(el) el.textContent = fmtTime(timerSeconds);
}

function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'kartoteka-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function triggerImport(){
  document.getElementById('importFile').click();
}
function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      state = Object.assign({inbox:[],projects:[],tasks:[],someday:[],habits:[],events:[],journal:[],pomodoroCount:0}, parsed);
      save(); render();
    }catch(err){
      alert('Не удалось прочитать файл — проверь, что это тот самый JSON.');
    }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

}

  if(activeTab==='inbox') html += renderInbox();

function renderCalendar(){
  const totalDays = new Date(calendarYear, calendarMonth+1, 0).getDate();
  const firstD = new Date(calendarYear, calendarMonth, 1);
  const firstWeekday = (firstD.getDay()+6)%7; // Mon=0..Sun=6
  const t = todayStr();

  let html = `
    <div class="cal-nav sans">
      <button onclick="prevMonth()">‹</button>
      <span>${MONTHS_RU[calendarMonth]} ${calendarYear}</span>
      <button onclick="nextMonth()">›</button>
    </div>
    <div class="cal-weekdays">${WEEKDAYS_SHORT.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-grid">
  `;
  for(let i=0;i<firstWeekday;i++){ html += `<div class="cal-cell empty"></div>`; }
  for(let d=1; d<=totalDays; d++){
    const ds = dateStrFromParts(calendarYear, calendarMonth, d);
    const s = daySummary(ds);
    const cls = ['cal-cell'];
    if(ds===t) cls.push('today');
    if(ds===selectedDate) cls.push('selected');
    let dots = '';
    if(s.habitsDone>0) dots += `<span style="background:var(--sage)"></span>`;
    if(s.tasks>0) dots += `<span style="background:var(--brick)"></span>`;
    if(s.events>0) dots += `<span style="background:var(--mustard)"></span>`;
    html += `<div class="${cls.join(' ')}" onclick="selectDay('${ds}')">${d}<div class="cal-dots">${dots}</div></div>`;
  }
  html += `</div>`;

  const selD = selectedDate ? new Date(selectedDate+'T00:00:00') : new Date();
  const wd = (selD.getDay()+6)%7;
  html += `<div class="day-detail-head">${selD.getDate()} ${MONTHS_RU_GEN[selD.getMonth()]}, ${WEEKDAYS_FULL[wd]}</div>`;

  // habits for this day
  html += `<p class="day-section-title sans">Привычки</p>`;
  if(state.habits.length===0){
    html += `<p class="section-note">Пока нет ни одной привычки.</p>`;
  }else{
    html += `<ul class="steps">` + state.habits.map(h=>{
      const on = h.doneDates.includes(selectedDate);
      return `<li>
        <span class="dot ${on?'on':''}" onclick="toggleHabitDate('${h.id}','${selectedDate}')"></span>
        <span class="stxt ${on?'on':''}">${escapeHtml(h.name)}</span>
      </li>`;
    }).join('') + `</ul>`;
  }

  // tasks for this day (scheduled or completed that day)
  const dayTasks = state.tasks.filter(tk=>tk.date===selectedDate || tk.doneDate===selectedDate);
  html += `<p class="day-section-title sans">Задачи</p>`;
  if(dayTasks.length===0){
    html += `<p class="section-note">На этот день задач нет.</p>`;
  }else{
    dayTasks.forEach(tk=>{
      html += `
        <div class="card">
          <p class="txt ${tk.done?'done':''}">${escapeHtml(tk.text)}</p>
          <div class="row-actions">
            <button class="chip ${tk.done?'':'go'}" onclick="toggleTask('${tk.id}')">${tk.done?'вернуть':'сделано'}</button>
          </div>
        </div>`;
    });
  }

  // events / plans
  html += `<p class="day-section-title sans">Планы</p>`;
  const dayEvents = state.events.filter(e=>e.date===selectedDate).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  if(dayEvents.length){

  return html;
}

const WEEKDAYS_FULL = ['понедельник','вторник','среда','четверг','пятница','суббота','воскресенье'];

function dateStrFromParts(y,m,d){
  return `${y}-${(m+1).toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
}
function prevMonth(){
  calendarMonth--; if(calendarMonth<0){calendarMonth=11; calendarYear--;}
  render();
}
function nextMonth(){
  calendarMonth++; if(calendarMonth>11){calendarMonth=0; calendarYear++;}
  render();
}
function goToday(){
  const t = new Date();
  calendarYear = t.getFullYear(); calendarMonth = t.getMonth();
  selectedDate = todayStr();
  render();
}
function selectDay(ds){
  selectedDate = ds;
  render();
}
function daySummary(ds){
  return {
    habitsDone: state.habits.filter(h=>h.doneDates.includes(ds)).length,
    tasks: state.tasks.filter(t=>t.date===ds || t.doneDate===ds).length,
    events: state.events.filter(e=>e.date===ds).length,
  };
}
function addEventForSelected(){
  const titleInp = document.getElementById('eventTitleInput');
  const timeInp = document.getElementById('eventTimeInput');
  if(!titleInp.value.trim()) return;
  state.events.push({id:uid(), title:titleInp.value.trim(), date:selectedDate, time:timeInp.value||null});
  titleInp.value=''; timeInp.value='';
  save(); render();
}
function deleteEvent(id){
  state.events = state.events.filter(e=>e.id!==id);
  save(); render();
}

function markdownToHtml(md){
  let s = escapeHtml(md);
  s = s.replace(/```([\s\S]*?)```/g, (m,code)=>`<pre><code>${code}</code></pre>`);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/^###### (.*)$/gm,'<h6>$1</h6>')
       .replace(/^##### (.*)$/gm,'<h5>$1</h5>')
       .replace(/^#### (.*)$/gm,'<h4>$1</h4>')
       .replace(/^### (.*)$/gm,'<h3>$1</h3>')
       .replace(/^## (.*)$/gm,'<h2>$1</h2>')
       .replace(/^# (.*)$/gm,'<h1>$1</h1>');
  s = s.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g,'<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/^&gt; (.*)$/gm,'<blockquote>$1</blockquote>');

  const lines = s.split('\n');
  let out = [];
  let inList = false;
  for(let line of lines){
    const isChecklist = /^[-*] \[[ xX]\] /.test(line);
    const isBullet = /^[-*] /.test(line);
    if(isChecklist || isBullet){
      if(!inList){ out.push('<ul>'); inList=true; }
      if(isChecklist){
        const checked = /\[[xX]\]/.test(line);
        const content = line.replace(/^[-*] \[[ xX]\] /,'');
        out.push(`<li><input type="checkbox" disabled ${checked?'checked':''}/> ${content}</li>`);
      }else{
        out.push(`<li>${line.replace(/^[-*] /,'')}</li>`);
      }
    }else{
      if(inList){ out.push('</ul>'); inList=false; }
      out.push(line);
    }
  }
  if(inList) out.push('</ul>');
  s = out.join('\n');
  s = s.replace(/\n{2,}/g,'<br><br>').replace(/\n/g,'<br>');
  s = s.replace(/<br>\s*(<\/?(h1|h2|h3|h4|h5|h6|ul|li|pre|blockquote)[^>]*>)/g, '$1');
  s = s.replace(/(<\/?(h1|h2|h3|h4|h5|h6|ul|li|pre|blockquote)[^>]*>)\s*<br>/g, '$1');
  return s;
}

function journalSetMode(mode){ journalMode = mode; render(); }
function journalStartNew(){
  journalDraft = {text:'', projectId:'', editingId:null};
  journalMode='write';
  render();
}
function journalEditEntry(id){
  const e = state.journal.find(e=>e.id===id);
  if(!e) return;
  journalDraft = {text:e.text, projectId:e.projectId||'', editingId:id};
  journalMode='write';
  render();
}
function journalCancelEdit(){
  journalDraft = {text:'', projectId:'', editingId:null};
  render();
}
function journalSave(){
  const text = journalDraft.text.trim();
  if(!text) return;
  const pid = journalDraft.projectId || null;
  if(journalDraft.editingId){
    const e = state.journal.find(e=>e.id===journalDraft.editingId);
    e.text = text; e.projectId = pid; e.updatedAt = Date.now();
  }else{
    state.journal.unshift({id:uid(), text, projectId:pid, createdAt:Date.now(), updatedAt:Date.now()});
  }
  journalDraft = {text:'', projectId:'', editingId:null};
  save(); render();
}
function deleteJournalEntry(id){
  state.journal = state.journal.filter(e=>e.id!==id);
  save(); render();
}

function fmtTime(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return m+':'+sec;
}
function modeMinutes(mode){
  return mode==='work' ? POMO_WORK : mode==='short' ? POMO_SHORT : POMO_LONG;
}
function modeLabel(mode){
  return mode==='work' ? 'Работа' : mode==='short' ? 'Короткий перерыв' : 'Длинный перерыв';
}

function toggleTimer(){
  if(timerRunning) timerPause(); else timerStart();
}
function timerStart(){
  if(timerRunning) return;
  if(timerSeconds<=0) timerSeconds = modeMinutes(timerMode)*60;
  timerRunning = true;
  clearInterval(timerInterval);
  timerInterval = setInterval(()=>{
    timerSeconds--;
    if(timerSeconds<=0){
      clearInterval(timerInterval);
      timerRunning=false;
      timerSeconds=0;
      handleTimerComplete();
      return;
    }
    updateTimerDisplay();
  },1000);
  render();
}
function timerPause(){
  timerRunning=false;
  clearInterval(timerInterval);
  render();
}
function handleTimerComplete(){
  if(timerMode==='work'){
    state.pomodoroCount++;
    save();
    timerMode = (state.pomodoroCount % 4 === 0) ? 'long' : 'short';
  }else{
    timerMode = 'work';
  }
  timerSeconds = modeMinutes(timerMode)*60;
  render();
}
function timerModeSet(mode){
  clearInterval(timerInterval);
  timerRunning=false;
  timerMode = mode;
  timerSeconds = modeMinutes(mode)*60;
  render();
}
function updateTimerDisplay(){
  const el = document.getElementById('timerNum');
  if(el) el.textContent = fmtTime(timerSeconds);
}

function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'kartoteka-' + todayStr() + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function triggerImport(){
  document.getElementById('importFile').click();
}
function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      state = Object.assign({inbox:[],projects:[],tasks:[],someday:[],habits:[],events:[],journal:[],pomodoroCount:0}, parsed);
      save(); render();
    }catch(err){
      alert('Не удалось прочитать файл — проверь, что это тот самый JSON.');
    }
  };
  reader.readAsText(file);
  evt.target.value = '';
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render(){
  const app = document.getElementById('app');
  if(!ready){ app.innerHTML = '<div class="loading">Открываю картотеку…</div>'; return; }

  const counts = {
    inbox: state.inbox.length,
    projects: state.projects.length,
    tasks: state.tasks.filter(t=>!t.done).length,
    learn: activeProjectCount(),
    habits: state.habits.length,
    calendar: null,
    journal: state.journal.length,
    someday: state.someday.length
  };

  let html = `
    <header>
      <h1>Картотека</h1>
      <p>Сначала запиши — потом разберёшь</p>
    </header>

    <div class="capture">
      <input id="captureInput" type="text" placeholder="Что пришло в голову?" />
      <button class="sans" onclick="handleCapture()">Внести</button>
    </div>

    <div class="toolbar sans">
      <button onclick="exportData()">⭳ выгрузить данные</button>
      <button onclick="triggerImport()">⭱ загрузить</button>
      <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)" />
    </div>

    <div class="tabs sans">
      ${tabBtn('inbox','Инбокс',counts.inbox)}
      ${tabBtn('projects','Проекты',counts.projects)}
      ${tabBtn('tasks','Задачи',counts.tasks)}
      ${tabBtn('learn','Фокус',null)}
      ${tabBtn('habits','Привычки',counts.habits)}
      ${tabBtn('calendar','Календарь',null)}
      ${tabBtn('journal','Дневник',counts.journal)}
      ${tabBtn('someday','Потом',counts.someday)}
    </div>
  `;

  if(activeTab==='inbox') html += renderInbox();
  if(activeTab==='projects') html += renderProjects();
  if(activeTab==='tasks') html += renderTasks();
  if(activeTab==='learn') html += renderLearn();
  if(activeTab==='habits') html += renderHabits();
  if(activeTab==='calendar') html += renderCalendar();
  if(activeTab==='journal') html += renderJournal();
  if(activeTab==='someday') html += renderSomeday();

  app.innerHTML = html;

  const inp = document.getElementById('captureInput');
  if(inp){
    inp.addEventListener('keydown', e=>{ if(e.key==='Enter') handleCapture(); });
  }
  const habitInp = document.getElementById('habitInput');
  if(habitInp){
    habitInp.addEventListener('keydown', e=>{ if(e.key==='Enter') handleAddHabit(); });
  }
  const eventTitleInp = document.getElementById('eventTitleInput');
  if(eventTitleInp){
    eventTitleInp.addEventListener('keydown', e=>{ if(e.key==='Enter') addEventForSelected(); });
  }
  const journalTa = document.getElementById('journalTextarea');
  if(journalTa){
    journalTa.addEventListener('input', e=>{ journalDraft.text = e.target.value; });
  }
  document.querySelectorAll('.add-step-input').forEach(inp=>{
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter'){
        addStep(inp.dataset.proj, inp.value);
        inp.value='';
      }
    });
  });
}

function tabBtn(id,label,count){
  const cls = activeTab===id ? 'tab active' : 'tab';
  const c = (count===null) ? '' : `<span class="count">${count}</span>`;
  return `<div class="${cls}" onclick="switchTab('${id}')">${label}${c}</div>`;
}

function handleCapture(){
  const inp = document.getElementById('captureInput');
  addInbox(inp.value);
  inp.value='';
  inp.focus();
}

function renderInbox(){
  if(state.inbox.length===0){
    return `<div class="empty"><span class="big">✎</span>Инбокс пуст — всё разобрано.<br>Впиши новую мысль наверху.</div>`;
  }
  let html = `<p class="section-note">Разложи каждую запись: это проект (несколько шагов), задача (одно действие) или пока «потом».</p>`;
  state.inbox.forEach(item=>{
    html += `
      <div class="card">
        <p class="txt">${escapeHtml(item.text)}</p>
        <div class="row-actions">
          <button class="chip go" onclick="moveToProject(${JSON.stringify(item).replace(/"/g,'&quot;')})">→ проект</button>
          <button class="chip go" onclick="moveToTask(${JSON.stringify(item).replace(/"/g,'&quot;')})">→ задача</button>
          <button class="chip" onclick="moveToSomeday(${JSON.stringify(item).replace(/"/g,'&quot;')})">→ потом</button>
          <button class="chip danger" onclick="deleteInbox('${item.id}')">удалить</button>
        </div>
      </div>`;
  });
  return html;
}

function renderProjects(){
  if(state.projects.length===0){
    return `<div class="empty"><span class="big">◧</span>Проектов пока нет.<br>Разбери что-нибудь из инбокса.</div>`;
  }
  let html = `<p class="section-note">Держи в фокусе максимум 2 активных проекта — остальные подождут.</p>`;
  state.projects.forEach(p=>{
    const doneCount = p.steps.filter(s=>s.done).length;
    const canActivate = p.active || activeProjectCount()<2;
    html += `
      <div class="card">
        <div class="proj-head">
          <span class="name">${escapeHtml(p.name)}</span>
          ${p.active ? '<span class="badge-active">в фокусе</span>' : '<span class="badge-parked">в очереди</span>'}
        </div>
        ${p.steps.length ? `<ul class="steps">` + p.steps.map(s=>`
          <li>
            <span class="dot ${s.done?'on':''}" onclick="toggleStep('${p.id}','${s.id}')"></span>
            <span class="stxt ${s.done?'on':''}">${escapeHtml(s.text)}</span>
          </li>`).join('') + `</ul>` : ''}
        <div class="add-step">
          <input class="add-step-input sans" data-proj="${p.id}" type="text" placeholder="Добавить шаг…" />
        </div>
        <div class="row-actions" style="margin-top:8px;">
          <button class="chip ${p.active?'':'go'}" ${!canActivate?'disabled style="opacity:0.4"':''} onclick="toggleProjectActive('${p.id}')">
            ${p.active ? 'снять фокус' : 'в фокус'}
          </button>
          <button class="chip danger" onclick="deleteProject('${p.id}')">удалить</button>
        </div>
      </div>`;
  });
  return html;
}

function renderTasks(){
  const open = state.tasks.filter(t=>!t.done);
  const done = state.tasks.filter(t=>t.done);
  if(state.tasks.length===0){
    return `<div class="empty"><span class="big">✓</span>Задач нет.<br>Разбери что-нибудь из инбокса.</div>`;
  }
  let html = '';
  open.forEach(t=>{
    html += `
      <div class="card">
        <p class="txt">${escapeHtml(t.text)}</p>
        <div class="row-actions">
          <button class="chip go" onclick="toggleTask('${t.id}')">сделано</button>
          <button class="chip danger" onclick="deleteTask('${t.id}')">удалить</button>
          <input type="date" class="chip sans" style="cursor:pointer;" value="${t.date||''}" onchange="scheduleTask('${t.id}', this.value)" />
          ${t.date ? `<span class="chip">📅 ${t.date}</span>` : ''}
        </div>
      </div>`;
  });
  if(done.length){
    html += `<p class="section-note" style="margin-top:14px;">Сделано</p>`;
    done.forEach(t=>{
      html += `
        <div class="card">
          <p class="txt done">${escapeHtml(t.text)}</p>
          <div class="row-actions">
            <button class="chip" onclick="toggleTask('${t.id}')">вернуть</button>
            <button class="chip danger" onclick="deleteTask('${t.id}')">удалить</button>
          </div>
        </div>`;
    });
  }
  return html;
}

function renderLearn(){
  const active = state.projects.filter(p=>p.active);
  let html = `
    <p class="section-note">Помидоро: 25 минут работы → 5 минут перерыв, каждый 4-й — 15 минут. Завершено помидоров: ${state.pomodoroCount}</p>
    <div class="timer-box">
      <div class="section-note sans" style="margin-bottom:2px;">${modeLabel(timerMode)}</div>
      <div class="timer-num" id="timerNum">${fmtTime(timerSeconds)}</div>
      <div class="timer-controls">
        <button class="primary" onclick="toggleTimer()">${timerRunning?'пауза':'старт'}</button>
        <button onclick="timerModeSet('work')" ${timerMode==='work'?'style="border-color:var(--ink)"':''}>работа 25</button>
        <button onclick="timerModeSet('short')" ${timerMode==='short'?'style="border-color:var(--ink)"':''}>перерыв 5</button>
        <button onclick="timerModeSet('long')" ${timerMode==='long'?'style="border-color:var(--ink)"':''}>перерыв 15</button>
      </div>
    </div>
  `;
  if(active.length===0){
    html += `<div class="empty"><span class="big">◎</span>Нет проектов в фокусе.<br>Отметь 1-2 проекта активными во вкладке «Проекты».</div>`;
  }else{
    active.forEach(p=>{
      const next = p.steps.find(s=>!s.done);
      html += `
        <div class="card">
          <div class="proj-head"><span class="name">${escapeHtml(p.name)}</span><span class="badge-active">в фокусе</span></div>
          ${next ? `<p class="txt">Следующий шаг: ${escapeHtml(next.text)}</p>` : `<p class="txt" style="color:var(--ink-soft)">Шаги не заданы — добавь во вкладке «Проекты».</p>`}
        </div>`;
    });
  }
  return html;
}

function renderHabits(){
  let html = `
    <p class="section-note">Ежедневные привычки — отмечай по факту, серия считается только если сегодня отмечено.</p>
    <div class="add-step" style="margin-bottom:14px;">
      <input id="habitInput" type="text" class="sans" placeholder="Новая привычка…" />
      <button class="sans" onclick="handleAddHabit()">Добавить</button>
    </div>
  `;
  if(state.habits.length===0){
    html += `<div class="empty"><span class="big">◐</span>Привычек пока нет.</div>`;
    return html;
  }
  state.habits.forEach(h=>{
    const t = todayStr();
    const doneToday = h.doneDates.includes(t);
    const streak = habitStreak(h);
    let dots = '';
    for(let i=-6;i<=0;i++){
      const ds = dateStrOffset(i);
      const on = h.doneDates.includes(ds);
      dots += `<span class="wdot ${on?'on':''}"></span>`;
    }
    html += `
      <div class="card">
        <div class="proj-head">
          <span class="name" style="font-size:15.5px;">${escapeHtml(h.name)}</span>
          <span class="badge-parked">🔥 ${streak}</span>
        </div>
        <div class="week-dots">${dots}</div>
        <div class="row-actions" style="margin-top:8px;">
          <button class="chip ${doneToday?'go':''}" onclick="toggleHabitToday('${h.id}')">${doneToday?'отмечено сегодня ✓':'отметить сегодня'}</button>
          <button class="chip danger" onclick="deleteHabit('${h.id}')">удалить</button>
        </div>
      </div>`;
  });
  return html;
}
function handleAddHabit(){
  const inp = document.getElementById('habitInput');
  addHabit(inp.value);
}

function renderCalendar(){
  const totalDays = new Date(calendarYear, calendarMonth+1, 0).getDate();
  const firstD = new Date(calendarYear, calendarMonth, 1);
  const firstWeekday = (firstD.getDay()+6)%7; // Mon=0..Sun=6
  const t = todayStr();

  let html = `
    <div class="cal-nav sans">
      <button onclick="prevMonth()">‹</button>
      <span>${MONTHS_RU[calendarMonth]} ${calendarYear}</span>
      <button onclick="nextMonth()">›</button>
    </div>
    <div class="cal-weekdays">${WEEKDAYS_SHORT.map(w=>`<span>${w}</span>`).join('')}</div>
    <div class="cal-grid">
  `;
  for(let i=0;i<firstWeekday;i++){ html += `<div class="cal-cell empty"></div>`; }
  for(let d=1; d<=totalDays; d++){
    const ds = dateStrFromParts(calendarYear, calendarMonth, d);
    const s = daySummary(ds);
    const cls = ['cal-cell'];
    if(ds===t) cls.push('today');
    if(ds===selectedDate) cls.push('selected');
    let dots = '';
    if(s.habitsDone>0) dots += `<span style="background:var(--sage)"></span>`;
    if(s.tasks>0) dots += `<span style="background:var(--brick)"></span>`;
    if(s.events>0) dots += `<span style="background:var(--mustard)"></span>`;
    html += `<div class="${cls.join(' ')}" onclick="selectDay('${ds}')">${d}<div class="cal-dots">${dots}</div></div>`;
  }
  html += `</div>`;

  const selD = selectedDate ? new Date(selectedDate+'T00:00:00') : new Date();
  const wd = (selD.getDay()+6)%7;
  html += `<div class="day-detail-head">${selD.getDate()} ${MONTHS_RU_GEN[selD.getMonth()]}, ${WEEKDAYS_FULL[wd]}</div>`;

  // habits for this day
  html += `<p class="day-section-title sans">Привычки</p>`;
  if(state.habits.length===0){
    html += `<p class="section-note">Пока нет ни одной привычки.</p>`;
  }else{
    html += `<ul class="steps">` + state.habits.map(h=>{
      const on = h.doneDates.includes(selectedDate);
      return `<li>
        <span class="dot ${on?'on':''}" onclick="toggleHabitDate('${h.id}','${selectedDate}')"></span>
        <span class="stxt ${on?'on':''}">${escapeHtml(h.name)}</span>
      </li>`;
    }).join('') + `</ul>`;
  }

  // tasks for this day (scheduled or completed that day)
  const dayTasks = state.tasks.filter(tk=>tk.date===selectedDate || tk.doneDate===selectedDate);
  html += `<p class="day-section-title sans">Задачи</p>`;
  if(dayTasks.length===0){
    html += `<p class="section-note">На этот день задач нет.</p>`;
  }else{
    dayTasks.forEach(tk=>{
      html += `
        <div class="card">
          <p class="txt ${tk.done?'done':''}">${escapeHtml(tk.text)}</p>
          <div class="row-actions">
            <button class="chip ${tk.done?'':'go'}" onclick="toggleTask('${tk.id}')">${tk.done?'вернуть':'сделано'}</button>
          </div>
        </div>`;
    });
  }

  // events / plans
  html += `<p class="day-section-title sans">Планы</p>`;
  const dayEvents = state.events.filter(e=>e.date===selectedDate).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));
  if(dayEvents.length){
    html += dayEvents.map(e=>`
      <div class="event-row">
        <span class="event-time">${e.time || ''}</span>
        <span style="flex:1;">${escapeHtml(e.title)}</span>
        <button class="chip danger" onclick="deleteEvent('${e.id}')">×</button>
      </div>`).join('');
  }
  html += `
    <div class="add-event">
      <input id="eventTitleInput" type="text" class="sans" placeholder="Новый план…" />
      <input id="eventTimeInput" type="time" class="sans" />
      <button class="chip go" onclick="addEventForSelected()">+</button>
    </div>
  `;

  return html;
}

function renderJournal(){
  let html = `<div class="card">
    <div class="jr-tabs sans">
      <span class="jr-tab ${journalMode==='write'?'active':''}" onclick="journalSetMode('write')">✎ Редактор</span>
      <span class="jr-tab ${journalMode==='preview'?'active':''}" onclick="journalSetMode('preview')">👁 Просмотр</span>
    </div>`;

  if(journalMode==='write'){
    html += `<textarea id="journalTextarea" class="journal-textarea" placeholder="Пиши в markdown: **жирный**, *курсив*, # заголовок, - список, &gt; цитата...">${escapeHtml(journalDraft.text)}</textarea>`;
  }else{
    html += `<div class="journal-preview">${journalDraft.text.trim() ? markdownToHtml(journalDraft.text) : '<span class="section-note">Пусто — переключись на редактор и напиши что-нибудь.</span>'}</div>`;
  }

  html += `<div class="row-actions" style="margin-top:10px;">
    <select id="journalProjectSelect" class="sans jr-select" onchange="journalDraft.projectId=this.value">
      <option value="">без привязки к проекту</option>
      ${state.projects.map(p=>`<option value="${p.id}" ${journalDraft.projectId===p.id?'selected':''}>${escapeHtml(p.name)}</option>`).join('')}
    </select>
  </div>`;
  html += `<div class="row-actions" style="margin-top:8px;">
    <button class="chip go" onclick="journalSave()">${journalDraft.editingId?'сохранить изменения':'сохранить запись'}</button>
    ${journalDraft.editingId ? `<button class="chip" onclick="journalCancelEdit()">отмена</button>` : ''}
  </div>`;
  html += `</div>`;

  if(state.journal.length===0){
    html += `<div class="empty"><span class="big">✒</span>Дневник пуст — напиши первую мысль выше.</div>`;
    return html;
  }

  html += `<p class="section-note" style="margin-top:18px;">Записи</p>`;
  state.journal.forEach(e=>{
    const proj = e.projectId ? state.projects.find(p=>p.id===e.projectId) : null;
    const d = new Date(e.createdAt);
    const dateLabel = `${d.getDate()} ${MONTHS_RU_GEN[d.getMonth()]}`;
    html += `
      <div class="card">
        <div class="proj-head">
          <span class="sans" style="font-size:11px;color:var(--ink-soft);">${dateLabel}</span>
          ${proj ? `<span class="badge-parked">${escapeHtml(proj.name)}</span>` : ''}
        </div>
        <div class="journal-preview">${markdownToHtml(e.text)}</div>
        <div class="row-actions" style="margin-top:8px;">
          <button class="chip" onclick="journalEditEntry('${e.id}')">редактировать</button>
          <button class="chip danger" onclick="deleteJournalEntry('${e.id}')">удалить</button>
        </div>
      </div>`;
  });
  return html;
}

function renderSomeday(){
  if(state.someday.length===0){
    return `<div class="empty"><span class="big">◫</span>Список «потом» пуст.</div>`;
  }
  let html = `<p class="section-note">Идеи, до которых пока не дошли руки — не пропали, просто ждут.</p>`;
  state.someday.forEach(item=>{
    html += `
      <div class="card">
        <p class="txt">${escapeHtml(item.text)}</p>
        <div class="row-actions">
          <button class="chip go" onclick="somedayToProject('${item.id}')">→ проект</button>
          <button class="chip go" onclick="somedayToTask('${item.id}')">→ задача</button>
          <button class="chip danger" onclick="deleteSomeday('${item.id}')">удалить</button>
        </div>
      </div>`;
  });
  return html;
}

load();
